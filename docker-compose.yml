services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: doma
      POSTGRES_PASSWORD: doma
      POSTGRES_DB: doma_test_production
    ports:
      - "8662:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doma"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://doma:doma@db:5432/doma_test_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-change-me-in-production}
      QUESTIONNAIRE_PATH: /rails/data.json
      RAILS_MAX_THREADS: "5"
    ports:
      - "8661:3000"

volumes:
  pgdata:
