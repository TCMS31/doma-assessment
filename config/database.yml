# Connection settings are environment driven so the same image runs locally and
# in a container. DATABASE_URL, when set, takes precedence over everything here.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV["DATABASE_HOST"] %>
  port: <%= ENV["DATABASE_PORT"] %>
  username: <%= ENV["DATABASE_USERNAME"] %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "doma_test_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_NAME", "doma_test_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "doma_test_production") %>
